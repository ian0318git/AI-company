; PlatformIO Project Configuration — M5Stack Core S3 Smart Garden
; Build:  pio run
; Upload: pio run --target upload
; Monitor: pio device monitor --baud 115200

[env:m5stack-core-s3]
platform = espressif32
board = m5stack-core-s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 specific
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Libraries (automatically fetched by PlatformIO)
lib_deps =
    m5stack/M5CoreS3@^1.0.0
    m5stack/M5GFX@^0.1.0
    knolleary/PubSubClient@^2.8

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
